name: CI

# 只跑 push：本仓只有 Fitness_Assistant 一条分支，走的是直接推送，不开 PR。
# 以后要接 PR 就补一行 `pull_request:`。
on: push

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 与开发机对齐（本机 node v26.4.0）。Next 16.3.1 自身只要求 >=20.9.0，
          # 但 CI 该测的是实际在跑的那个版本，不是最低可跑的版本。
          node-version: "26"
          cache: npm

      - run: npm ci

      # 必须显式跑，两件事都靠它：
      #   1. @prisma/client 的类型（tsc 找不到 PrismaClient 就红）
      #   2. 平台引擎（schema 里没有 binaryTargets，靠探测 openssl 决定下哪个）
      # package.json 没有 postinstall，不跑这行就什么都没有。
      - run: npx prisma generate

      - run: npm run lint

      # 必须先生成类型再检查，不能直接 tsc。
      # Next 16 的 `LayoutProps` / `PageProps` / 路由类型是**生成物**，落在
      # .next/types/routes.d.ts，并由 next-env.d.ts 引用 —— 两者都在 .gitignore 里，
      # 所以 runner 上根本不存在。跳过这步直接 tsc，报的是
      #   src/app/layout.tsx(57,50): error TS2304: Cannot find name 'LayoutProps'.
      # （已在「移走 .next/ 与 next-env.d.ts」的状态下实测复现，typegen 后 exit 0。）
      # 这也是 Next 16 文档给的 CI 用法：next typegen && tsc --noEmit，见
      # node_modules/next/dist/docs/01-app/03-api-reference/06-cli/next.md
      - run: npx next typegen

      # 类型检查。`npm run lint` 是裸 eslint，不做类型检查；CI 里也不跑
      # `next build`，少了这步类型错误要等本地构建才暴露。
      - run: npx tsc --noEmit

      - run: npm test
